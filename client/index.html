<!doctype html>
<!-- Dark by default: the app opens on the dark basemap. The light/dark switch
     in Settings swaps this class at runtime (components/theme/ThemeProvider),
     and the script below applies a stored choice before first paint. -->
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Klima: Climate Map</title>
  <script>
    // The stored theme, applied before first paint so a light-mode reload does
    // not flash dark first. Same key as THEME_STORAGE_KEY in
    // components/theme/themeContext.
    try {
      const theme = localStorage.getItem('klima-theme') === 'light' ? 'light' : 'dark'
      document.documentElement.classList.toggle('dark', theme === 'dark')
      document.documentElement.style.colorScheme = theme
    } catch (error) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
